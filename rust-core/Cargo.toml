[package]
name = "table-core-rs"
version = "0.1.0"
edition = "2024"
description = "Excel table diff and three-way merge CLI for TableManager"
license = "MIT"

[lib]
name = "table_core"
path = "src/lib.rs"

[[bin]]
name = "table-core"
path = "src/main.rs"

[dependencies]
calamine = "0.38.0"
clap = { version = "4.6.8", features = ["derive"] }
regex = "1.12"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
